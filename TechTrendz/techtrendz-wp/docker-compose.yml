services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql  # Reference the custom Dockerfile
    container_name: wordpress_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql:rw
    networks:
      - app-network
    ports:
      - "3306:3306"

  wordpress:
    image: wordpress:6.6.2-fpm-alpine
    container_name: wordpress_dev
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:1.27.2-alpine
    container_name: wordpress_nginx
    ports:
      - "3007:80"  # Exposes Nginx on localhost port 3007
    volumes:
      - wordpress_data:/var/www/html  # Shares WordPress files with Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Nginx configuration file
    depends_on:
      - wordpress
    networks:
      - app-network

volumes:
  wordpress_data:
  db_data:

networks:
  app-network:
    driver: bridge